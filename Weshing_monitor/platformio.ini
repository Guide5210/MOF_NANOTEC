; PlatformIO Project Configuration File
; ESP32-D0WD-V3 (ESP32-WROOM dual core) on COM3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Upload / Monitor ---
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
; ถ้าอัปโหลดช้า ลองเพิ่มเป็น 921600 ได้
upload_speed = 460800

; --- Libraries ที่โค้ดเรียกใช้ (ตัด Blynk ออกแล้ว) ---
lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
